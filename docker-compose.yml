version: "3.9"

services:
  sjur-app:
    build:
      context: .
      args:
        MODE: ${MODE:-production}
    container_name: sjur-poc
    hostname: sjur-app

    # 👉 PARA USO LOCAL, DESCOMENTE AS LINHAS ABAIXO
    # ports:
    #   - "8000:8000"  # FastAPI (local)
    #   - "8501:8501"  # Streamlit (local)

    # 👉 PARA USO EM PRODUÇÃO, DESCOMENTE A LINHA ABAIXO
    ports:
      - "443:443"     # NGINX (prod)

    volumes:
      - sjur-data:/app/data:rw
      - ./logs:/app/logs:rw
      - ./certs:/etc/ssl/certs:ro
    environment:
      - MODE=${MODE:-production}
      - PYTHONUNBUFFERED=1
      - TZ=America/Sao_Paulo
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - BROWSER_GATHERUSAGESTATS=false
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  sjur-data:
