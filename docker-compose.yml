version: '3.8'

services:
  sjur-app:
    build:
      context: .
      args:
        MODE: ${MODE}  # Lê do .env
    container_name: sjur-poc
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data            # banco de dados local
      - ./logs:/app/logs            # logs da aplicação
      # Apenas se MODE=prod (certificados montados pela infraestrutura)
      - ./certs/server.crt:/etc/ssl/certs/server.crt
      - ./certs/server.key:/etc/ssl/certs/server.key
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=America/Sao_Paulo
    env_file:
      - .env
    restart: unless-stopped
