services:
  sjur-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODE: ${MODE:-prod}
    container_name: sjur-frontend
    hostname: sjur-frontend

    # 👉 Para uso local:
    ports:
      - "8501:8501"  # Streamlit

    # 👉 Em produção, os certificados serão montados por volume externo
    volumes:
      - ./certs:/etc/ssl/certs:ro
      - ./logs:/app/logs:rw
      - sjur-data:/app/data:rw

    environment:
      - MODE=${MODE:-prod}
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - BROWSER_GATHERUSAGESTATS=false
      - PYTHONUNBUFFERED=1
      - TZ=America/Sao_Paulo

    env_file:
      - .env

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  sjur-data:
